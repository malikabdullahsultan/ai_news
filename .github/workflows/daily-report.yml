name: Daily AI Intelligence

on:
  schedule:
    # 03:30 Asia/Hong_Kong is 19:30 UTC on the previous UTC date.
    - cron: '30 19 * * *'
    # Idempotent retries protect against delayed schedules, feed timeouts, and free-tier outages.
    - cron: '30 22 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Optional Hong Kong report date to backfill (YYYY-MM-DD)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER: sambanova
      AI_MODEL: auto
      FREE_ONLY: 'true'
      TIMEZONE: Asia/Hong_Kong
      REPORT_TIME: '03:30'
      MAX_RESEARCH_ITEMS: '24'
      MAX_SOURCE_FETCHES: '36'
      RECENT_REPORT_CONTEXT_DAYS: '3'
      MAX_CONTINUATIONS: '2'
      MAX_PROVIDER_FALLBACKS: '2'
      MAX_OUTPUT_TOKENS: '14000'
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      REPORT_DATE_OVERRIDE: ${{ inputs.report_date }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate and validate report with SambaNova Free Tier
        run: |
          if [ -n "$REPORT_DATE_OVERRIDE" ]; then
            python scripts/report_pipeline.py --date "$REPORT_DATE_OVERRIDE"
          else
            python scripts/report_pipeline.py
          fi

      - name: Upload redacted generated Markdown for debugging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-report-${{ github.run_id }}
          path: data/debug/generated-report.md
          if-no-files-found: warn
          retention-days: 7

      - name: Commit new report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ data/research/
          if git diff --cached --quiet; then
            echo 'No report changes to commit.'
          else
            git commit -m "chore: publish Daily AI Intelligence report"
            git push
          fi
